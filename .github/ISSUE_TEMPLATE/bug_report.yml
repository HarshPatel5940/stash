name: Bug report
description: Report a reproducible problem with stash
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include as much detail as you can.
  - type: input
    id: version
    attributes:
      label: Stash version
      description: Run `stash --version`
      placeholder: v0.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "14.5 (23F79)"
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: Install method
      placeholder: "Homebrew / curl script / go install"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the exact commands and sequence.
      placeholder: |
        1. stash init
        2. stash backup --verbose
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste relevant logs or output.
      render: shell
    validations:
      required: false
